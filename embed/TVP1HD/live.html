    <div data-shaka-player-container style='position:absolute;z-index: -1;top: 0;left: 0;width: 100%; height: 100%;object-fit: cover;'>
      <video autoplay data-shaka-player poster="" id='video' style='width:100%;height:100%;'></video>
    </div>
<body style="background-color:#000;">
 <script type="f5ddb139b7dfe7319f8a5cc3-text/javascript"> 
      document.addEventListener('contextmenu', event=> event.preventDefault()); 
      document.onkeydown = function(e) { 
      if(event.keyCode == 123) { 
      return false; 
      } 
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)){ 
      return false; 
      } 
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)){ 
      return false; 
      } 
      if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)){ 
      return false; 
      } 
      } 
      </script> 
<script src="/cdn-cgi/scripts/7d0fa10a/cloudflare-static/rocket-loader.min.js" data-cf-settings="f5ddb139b7dfe7319f8a5cc3-|49" defer></script></html>
<script type="f5ddb139b7dfe7319f8a5cc3-text/javascript">
    const manifestUri = 'https://estreams.tv.nej.cz/dash/CH_TVP1_Portable.ism/playlist.mpd';

    async function init() {
        const video = document.getElementById('video');
        const ui = video['ui'];
        const controls = ui.getControls();
        const player = controls.getPlayer();

        window.player = player;
        window.ui = ui;

        player.addEventListener('error', onPlayerErrorEvent);

        // --- KONFIGURACJA Z DRM ---
        player.configure({
            streaming: {
                useNativeHlsOnSafari: true
            },
            drm: {
                clearKeys: {
                    "": "",
                }
            }
        });
        // ---------------------------

        controls.addEventListener('error', onUIErrorEvent);

        try {
            await player.load(manifestUri);

            // -------- WYBÓR NAJLEPSZEJ JAKOŚCI ----------
            const tracks = player.getVariantTracks();

            let best = tracks.sort((a, b) => {
                if (a.height === b.height) return b.bandwidth - a.bandwidth;
                return b.height - a.height;
            })[0];

            player.configure({ abr: { enabled: false } });
            player.selectVariantTrack(best, true);
            // --------------------------------------------

        } catch (error) {
            onPlayerError(error);
        }
    }

    function onPlayerErrorEvent(errorEvent) {
        onPlayerError(errorEvent.detail);
    }

    function onPlayerError(error) {
        console.error('Error code', error.code, 'object', error);
    }

    function onUIErrorEvent(errorEvent) {
        onPlayerError(errorEvent.detail);
    }

    function initFailed(errorEvent) {
        console.error('Unable to load the UI library!');
    }

    document.addEventListener('shaka-ui-loaded', init);
    document.addEventListener('shaka-ui-load-failed', initFailed);
  </script>
